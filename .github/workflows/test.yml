name: Tests & Linting

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  shellcheck:
    name: ShellCheck & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Bash & Python syntax
        run: |
          bash -n bin/rlb
          bash -n install.sh
          bash -n uninstall.sh
          python3 -m py_compile bin/rlb-telegram-bot

      - name: Run ShellCheck
        run: |
          shellcheck bin/rlb install.sh uninstall.sh
